name: flutter_clean_architecture
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  general_repository:
    path: packages/general_repository
  authentication_repository:
    path: packages/authentication_repository
  cache:
    path: packages/cache
  localization:
    path: packages/localization
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  http: ^1.5.0
  formz: ^0.8.0
  file_picker: ^10.3.3
  pin_code_fields: ^8.0.1
  location: ^8.0.1
  camera: ^0.11.2
  video_compress: ^3.1.4
  socket_io_client: ^3.1.2
  dropdown_button2: ^2.3.9
  permission_handler: ^12.0.1
  image: ^4.5.4
  path_provider: ^2.1.5
  video_player: ^2.10.0
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.2
  go_router: ^17.1.0
  connectivity_plus: ^7.0.0
  get_it: ^9.2.0
 



dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/l10n/

  fonts:
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla-Light.ttf
          weight: 300
        - asset: assets/fonts/Karla-Regular.ttf
          weight: 400
        - asset: assets/fonts/Karla-Medium.ttf
          weight: 500
        - asset: assets/fonts/Karla-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Karla-Bold.ttf
          weight: 700


